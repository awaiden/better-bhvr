services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-better_bhvr}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - better_bhvr_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-better_bhvr}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  better_bhvr_pg_data:
